spring.application.name=citasalud
server.port=${PORT:8080}

# Conexión a MongoDB. En la nube se pasa con la variable de entorno MONGODB_URI (nunca se sube al repositorio).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/citasalud}
spring.data.mongodb.auto-index-creation=true

# Clave para firmar los tokens JWT. En la nube se pasa con la variable JWT_SECRET.
# El valor por defecto solo sirve para desarrollo local.
app.jwt.secreto=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-en-la-nube-1234567890}
app.jwt.horas-validez=8

# Orígenes permitidos para el frontend (separados por coma)
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Si es true y la base está vacía, se cargan datos de prueba al arrancar
app.datos-prueba=${DATOS_PRUEBA:true}

# Zona horaria de la clínica
app.zona-horaria=America/Bogota

springdoc.swagger-ui.path=/swagger-ui.html
