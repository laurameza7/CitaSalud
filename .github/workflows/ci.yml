name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar y ejecutar pruebas JUnit
        run: mvn -B test
        working-directory: backend
      - name: Empaquetar
        run: mvn -B package -DskipTests
        working-directory: backend
      - name: Arrancar la API
        run: |
          java -jar backend/target/citasalud-backend-1.0.0.jar &
          for i in $(seq 1 30); do curl -s localhost:8080/api/estado && break; sleep 2; done
      - name: Ejecutar la colección de Postman con Newman
        run: |
          npm install -g newman
          newman run postman/CitaSalud.postman_collection.json -e postman/CitaSalud-Local.postman_environment.json
