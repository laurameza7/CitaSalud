# Blueprint de Render para desplegar el backend (Docker). Las variables secretas se ponen en el panel de Render.
services:
  - type: web
    name: citasalud-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/estado
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGENES
        sync: false
      - key: DATOS_PRUEBA
        value: "true"
